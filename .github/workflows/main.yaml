name: Main
on: pull_request

jobs:
  unit-tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      -  uses: shivammathur/setup-php@2
         with:
           php-version: '8.3'

      - name: Checkout Repository
        uses: actions/checkout@v1

      - name: Unit
        run: |
          composer install --no-interaction
          php ./bin/phpunit
